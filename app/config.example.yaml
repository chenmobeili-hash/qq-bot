# 复制为 config.yaml 后填写；此示例不包含可用的账号、密钥或代理节点。
# 管理员是下列 QQ 号，不等同于 QQ 群管理头衔。
admin_qq: []
target_group_ids: [123456789]  # 占位号；请替换，否则程序拒绝启动。
napcat:
  ws_url: ws://127.0.0.1:5098
  api_http_url: http://127.0.0.1:3000
  access_token: ""           # 与 OneBot WS 服务端一致
  api_http_token: ""         # 与 OneBot HTTP 服务端一致

# deepseek 是历史遗留的通用聊天配置名，并不限定模型品牌。
deepseek:
  enabled: false
  api_key: ""
  endpoint: https://api.example.com/v1
  model: YOUR_MODEL
  system_prompt: 你是一个友善、准确的聊天助手。
  max_history: 20
  trigger_groups: []         # 留空表示不限制群；填写希望使用的群号。
  trigger_private: false
llm_providers:
  example:
    enabled: false
    endpoint: https://api.example.com/v1
    api_key: ""
    models: [YOUR_MODEL]
  # 填写Google AI Studio密钥并启用；可用于独立听觉选择。
  google_ai_studio:
    enabled: false
    endpoint: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key: ''
    models:
    - gemini-3.8-flash
    - gemini-3.5-flash-lite
    - gemini-3.6-flash
    - gemini-4-argon
current_provider: example
current_model: YOUR_MODEL

# 视觉同步关闭时使用此独立配置；开启后跟随主模型（需支持图片输入）。
qwen_vl:
  enabled: false
  endpoint: https://api.example.com/v1
  api_key: ""
  model: YOUR_VISION_MODEL

# 独立听觉配置；“听觉同步 开启”时跟随主模型，关闭后恢复此块。
audio_input:
  enabled: false
  endpoint: https://api.example.com/v1
  api_key: ""
  model: YOUR_AUDIO_MODEL
  api_format: input_audio
  trigger_groups: []
  include_frames: false      # 仅当同一音频接口还支持图片时开启。
  local_record_roots: []     # 仅填写真实的QQ语音转码缓存目录，不开放整个磁盘。

image_download:
  proxy_only: true
  # 可选，仅覆盖图片下载；请先准备一个本地 HTTP 代理，再取消下行注释。
  # image_proxy_url: http://127.0.0.1:18092
  # 没有覆盖项时读取环境 HTTP 代理；严格模式下不回落直连。

proactive:
  enabled: true              # 允许管理员在指定群开启；初始各群仍未开启。
  groups: []
  daily_limit: 24
  quiet_start: 23
  quiet_end: 8
  images_enabled: true
  ignore_user_ids: []         # 可添加其他忽略账号；官方Q群管家始终排除。
paper_reader:
  auto_read:
    enabled: true            # 还需在群内开启主动模式和主动阅读。
long_term_memory:
  enabled: true
whale_stickers:
  enabled: true
bilibili:
  enabled: false             # 先配置并验收，再开启和登录。
serper_api_key: ""
saucenao:
  enabled: false
  api_key: ""
auto_reply:
  enabled: false
  groups: []
  rules: []
welcome:
  enabled: false
  groups: []
  message: 欢迎加入。
schedule: []
messages_file: messages.txt
heartbeat_interval: 30

# 首次部署默认关闭；管理员可发“好友申请 开启”全局开启。
friend_requests:
  enabled: false

# 将本段合并到你自己的 app/config.yaml 顶层；已存在serpapi时编辑原段，不要重复添加。
# key只填在自己的配置或环境变量里，不要提交GitHub或聊天。
serpapi:
  enabled: false
  api_key: ""                    # 在这里填你的SerpApi key；不是Serper key。
  api_key_env: SERPAPI_API_KEY     # api_key为空时，可从同名环境变量读取。
  hl: zh-cn
  timeout_seconds: 55
  daily_limit: 20                 # 本地滚动24小时最多20次尝试，重启不清零。
  min_interval_seconds: 8
  proxy: ""                      # 留空跟随bot进程的环境HTTP代理；可填本机HTTP代理入口。

# Fish Audio TTS; this section is private, never upload a real key to GitHub.
fish_audio:
  enabled: false
  api_key: ""
  api_key_env: FISH_AUDIO_API_KEY
  model: s2.1-pro-free
  voice_id: ""
  voices: {}
  default_voice: ""
  max_chars: 180
  max_seconds: 30
  timeout_seconds: 55
  daily_limit: 60
  scope_daily_limit: 20
  auto_cooldown_seconds: 60
  use_env_proxy: true
  proxy: ""
